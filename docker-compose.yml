services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    image: pepebarrascout/cms-estatico-xml:latest
    container_name: cms-estatico-xml
    ports:
      - "${CMS_PORT:-8080}:80"
    volumes:
      - cms-data:/var/www/html/data
      - cms-static:/var/www/html/static
    environment:
      - TZ=${TZ:-America/Guatemala}
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cms-data:
    driver: local
  cms-static:
    driver: local
